<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>

    <div class="container">

        <div class="left-side">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="Login Image">
        </div>

        <div class="right-side">
            <div class="login-box">
                <h2>Welcome Back</h2>
                <p>Please login to your account</p>

                <form>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" placeholder="Enter your username or email" id="userName" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter your password" id="password" required>
                    </div>

                    <div class="remember-box">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <div class="extra-links">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>

                    <button type="submit" id="login-btn">Login</button>

                    <div class="extra-links">
                        <a href="register.html">Create Account</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script type="module" src="js/login_script.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
