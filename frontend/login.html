<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>

    <div class="container">

        <div class="left-side">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="Login Image">
        </div>

        <div class="right-side">
            <div class="lang-switch">
                <button id="langToggle">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langText">عربي</span>
                </button>
            </div>

            <div class="login-box">
                <h2 data-i18n="welcome_back">Welcome Back</h2>
                <p data-i18n="please_login">Please login to your account</p>

                <form>
                    <div class="input-group">
                        <label data-i18n="username_lbl">Username</label>
                        <input type="text" placeholder="Enter your username or email" id="userName" data-i18n-ph="username_ph" required>
                    </div>

                    <div class="input-group">
                        <label data-i18n="password_lbl">Password</label>
                        <input type="password" placeholder="Enter your password" id="password" data-i18n-ph="password_ph" required>
                    </div>

                    <div class="remember-box">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe" data-i18n="remember_me">Remember me</label>
                    </div>
                    <div class="extra-links">
                        <a href="forgot-password.html" data-i18n="forgot_password">Forgot Password?</a>
                    </div>

                    <button type="submit" id="login-btn" data-i18n="login_btn">Login</button>

                    <div class="extra-links">
                        <a href="register.html" data-i18n="create_account">Create Account</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        const translations = {
            en: {
                welcome_back: "Welcome Back",
                please_login: "Please login to your account",
                username_lbl: "Username",
                username_ph: "Enter your username or email",
                password_lbl: "Password",
                password_ph: "Enter your password",
                remember_me: "Remember me",
                forgot_password: "Forgot Password?",
                login_btn: "Login",
                create_account: "Create Account"
            },
            ar: {
                welcome_back: "مرحباً بعودتك",
                please_login: "يرجى تسجيل الدخول إلى حسابك",
                username_lbl: "اسم المستخدم",
                username_ph: "أدخل اسم المستخدم أو البريد الإلكتروني",
                password_lbl: "كلمة المرور",
                password_ph: "أدخل كلمة المرور",
                remember_me: "تذكرني",
                forgot_password: "نسيت كلمة المرور؟",
                login_btn: "تسجيل الدخول",
                create_account: "إنشاء حساب"
            }
        };

        let currentLang = 'en';
        const langToggleBtn = document.getElementById('langToggle');

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('langText').textContent = currentLang === 'en' ? 'عربي' : 'English';

            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    elem.textContent = translations[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-ph');
                if (translations[currentLang][key]) {
                    elem.placeholder = translations[currentLang][key];
                }
            });
        });
    </script>
    <script type="module" src="js/login_script.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
