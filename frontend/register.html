<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/login_style.css">
</head>

<body>

<div class="container">

    <div class="left-side">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
    </div>

    <div class="right-side">

        <div class="lang-switch" style="display:flex; gap:10px;">
            <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button id="langToggle">
                <i class="fa-solid fa-globe"></i>
                <span id="langText">عربي</span>
            </button>
        </div>

        <div class="login-box">

            <h2 data-i18n="create_account">Create Account</h2>
            <p data-i18n="fill_info">Please fill the information</p>

            <form>

                <div id="step1">

                    <div class="name-row" style="display:flex; gap:10px;">
                        <div class="input-group" style="flex:1;">
                            <label data-i18n="first_name_lbl">First Name</label>
                            <input type="text" placeholder="First Name" id="fName" data-i18n-ph="first_name_ph">
                        </div>

                        <div class="input-group" style="flex:1;">
                            <label data-i18n="last_name_lbl">Last Name</label>
                            <input type="text" placeholder="Last Name" id="lName" data-i18n-ph="last_name_ph">
                        </div>
                    </div>

                    <div class="input-group">
                        <label data-i18n="username_lbl">Username</label>
                        <input type="text" placeholder="Username" id="userName" data-i18n-ph="username_ph">
                    </div>

                    <div class="input-group">
                        <label data-i18n="email_lbl">Email</label>
                        <input type="email" placeholder="Enter your email" id="email" data-i18n-ph="email_ph">
                    </div>

                    <button type="button" id="sendCodeBtn" data-i18n="send_code">Send Verification Code</button>

                </div>

                <div id="verifySection" style="display:none;">
                    <div class="input-group">
                        <label data-i18n="verify_lbl">Verification Code</label>
                        <input type="text" id="otp" placeholder="Enter code" data-i18n-ph="verify_ph">
                    </div>

                    <button type="button" id="verifyBtn" data-i18n="verify_btn">Verify</button>
                </div>

                <div id="passwordSection" style="display:none;">
                    <div class="input-group">
                        <label data-i18n="password_lbl">Password</label>
                        <input type="password" placeholder="Enter password" id="password" data-i18n-ph="password_ph">
                    </div>

                    <div class="input-group">
                        <label data-i18n="confirm_password_lbl">Confirm Password</label>
                        <input type="password" placeholder="Confirm password" id="confirmPassword" data-i18n-ph="confirm_password_ph">
                    </div>

                    <div class="input-group">
                        <label data-i18n="phone_lbl">Phone Number</label>
                        <input type="text" placeholder="Phone number" id="phone" data-i18n-ph="phone_ph">
                    </div>

                    <div class="input-group">
                        <label data-i18n="address_lbl">Address</label>
                        <input type="text" placeholder="Address" id="address" data-i18n-ph="address_ph">
                    </div>

                    <div class="input-group">
                        <label data-i18n="payment_lbl">Payment Method</label>

                        <select class="payment" id="payment">
                            <option data-i18n="cash">Cash</option>
                            <option data-i18n="fawry">Fawry</option>
                            <option data-i18n="visa">Visa</option>
                        </select>
                    </div>

                    <button type="submit" id="register-btn" data-i18n="register_btn">Register</button>
                </div>

                <div class="extra-links">
                    <span data-i18n="have_account">Have an account?</span>
                    <a href="login.html" data-i18n="login_link">Login</a>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="js/localization.js"></script>
<script type="module" src="js/register_script.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
