<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>

<body>

<div class="container">

    <div class="left-side">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
    </div>

    <div class="right-side">

        <div class="login-box">

            <h2>Create Account</h2>
            <p>Please fill the information</p>

            <form>

                <div id="step1">

                    <div class="name-row">
                        <div class="input-group">
                            <label>First Name</label>
                            <input type="text" placeholder="First Name" id="fName">
                        </div>

                        <div class="input-group">
                            <label>Last Name</label>
                            <input type="text" placeholder="Last Name" id="lName">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" placeholder="Username" id="userName">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email" id="email">
                    </div>

                    <button type="button" id="sendCodeBtn">Send Verification Code</button>

                </div>

                <div id="verifySection" style="display:none;">
                    <div class="input-group">
                        <label>Verification Code</label>
                        <input type="text" id="otp" placeholder="Enter code">
                    </div>

                    <button type="button" id="verifyBtn">Verify</button>
                </div>

                <div id="passwordSection" style="display:none;">
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter password" id="password">
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm password" id="confirmPassword">
                    </div>

                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="text" placeholder="Phone number" id="phone">
                    </div>

                    <div class="input-group">
                        <label>Address</label>
                        <input type="text" placeholder="Address" id="address">
                    </div>

                    <div class="input-group">
                        <label>Payment Method</label>

                        <select class="payment" id="payment">
                            <option>Cash</option>
                            <option>Fawry</option>
                            <option>Visa</option>
                        </select>
                    </div>

                    <button type="submit" id="register-btn">Register</button>
                </div>

                <div class="extra-links">
                    <span>Have an account?</span>
                    <a href="login.html">Login</a>
                </div>

            </form>

        </div>

    </div>

</div>

<script type="module" src="js/register_script.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
