<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="js/auth.js"></script>
  <title>FurniFind - Upload by Image</title>

  <link rel="stylesheet" href="css/all.css">
  <link rel="stylesheet" href="css/header_style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar_inner">

      <a class="brand" href="#">
        <span class="brand_icon"><i class="fa-solid fa-chair"></i></span>
        <span class="brand_text">FurniFind</span>
      </a>

      <nav class="nav">
        <a href="#" class="nav_link active">Home</a>
        <a href="#" class="nav_link">Categories</a>
        <a href="#" class="nav_link">Best Sellers</a>
      </nav>

      <div class="actions">
        
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search for furniture..." />
        </div>
        <button class="btn" id="themeToggle" title="Toggle Dark Mode">
          <i class="fa-solid fa-moon"></i>
        </button>

        <div class="user-area">
          <button class="btn" id="authBtn" type="button">
            <i class="fa-regular fa-user"></i>
            <span id="authText">Login</span>
          </button>

          <div class="dropdown">
            <button class="btn" id="settingsBtn" type="button">
              <i class="fa-solid fa-gear"></i>
            </button>

            <div class="dropdown-menu" id="dropdownMenu">
              <div class="user-info" id="userInfo">Hello, User</div>
              <a href="profile.html">Profile</a>
              <a href="edit-profile.html">Edit Info</a>
            </div>
          </div>
        </div>

        <button class="btn cart" type="button" aria-label="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge" id="cartBadge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="hero">

      <section class="hero_left">
        <h1>Find Furniture by Image</h1>
        <p class="sub">Upload a photo and discover similar furniture instantly.</p>

        <div class="upload_card">
          <div class="dropzone" id="dropzone">
            <div class="icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <h3>Drag &amp; Drop Image Here or</h3>

            <input type="file" id="fileInput" accept="image/*" hidden />
            <button class="upload_btn" id="uploadBtn" type="button">Upload Photo</button>

            <p class="filename" id="fileName" style="display:none;"></p>
          </div>
        </div>
      </section>

      <aside class="preview_wrap" id="previewWrap">
        <div class="preview_card">
          <img id="previewImg" alt="Preview" />
        </div>
      </aside>

    </div>
  </main>

<section class="results_section" id="resultsSection" style="display:none;">
  <div class="container">
    <h2>Similar Items Found</h2>
    <div class="results_grid" id="resultsGrid"></div>
  </div>
</section>

<aside class="cart_div" id="cart_div">
    <div class="cart_container">
        <div class="first_part">
            <p id="cart_counter">your cart (0)</p>
            <i class="fa-solid fa-xmark exit_mark" id="exit_mark"></i>
        </div>

        <div class="cart_content">
            <h2 class="cart_title">your cart is empty</h2>
        </div>

        <div class="total_section">
            <div class="total_cast_section">
                <span class="total_cost_lable">total cost:</span>

                <div class="total_cast_price">
                    <p class="final-total">$0</p>
                </div>
            </div>

            <button class="checkout-btn"> checkout</button>
        </div>
    </div>
</aside>

<script type="module" src="js/upload.js"></script>

<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const authBtn = document.getElementById("authBtn");
const authText = document.getElementById("authText");
const settingsBtn = document.getElementById("settingsBtn");
const dropdownMenu = document.getElementById("dropdownMenu");
const userInfo = document.getElementById("userInfo");

function isLoggedIn() {
  return localStorage.getItem("isLoggedIn") === "true" ||
         sessionStorage.getItem("isLoggedIn") === "true";
}

function setLoggedOutUI() {
  authText.textContent = "Login";
  settingsBtn.style.display = "none";
  dropdownMenu.classList.remove("show");
  userInfo.textContent = "Hello, User";
}

function setLoggedInUI(username) {
  authText.textContent = "Logout";
  settingsBtn.style.display = "inline-flex";
  userInfo.textContent = "Hello, " + username;
}

onAuthStateChanged(auth, async (user) => {
  if (!user || !isLoggedIn()) {
    setLoggedOutUI();
    return;
  }

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {
      const data = userSnap.data();
      const currentUsername = data.username || "User";

      if (localStorage.getItem("isLoggedIn") === "true") {
        localStorage.setItem("currentUser", currentUsername);
      }

      if (sessionStorage.getItem("isLoggedIn") === "true") {
        sessionStorage.setItem("currentUser", currentUsername);
      }

      setLoggedInUI(currentUsername);
    } else {
      setLoggedOutUI();
    }
  } catch (error) {
    console.error(error);
    setLoggedOutUI();
  }
});

authBtn.addEventListener("click", async () => {
  if (isLoggedIn()) {
    try {
      await signOut(auth);
    } catch (error) {
      console.error(error);
    }

    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUserEmail");
    localStorage.removeItem("expiryTime");
    localStorage.removeItem("rememberMe");
    localStorage.removeItem("rememberedUsername");

    sessionStorage.removeItem("isLoggedIn");
    sessionStorage.removeItem("currentUser");
    sessionStorage.removeItem("currentUserEmail");
    sessionStorage.removeItem("expiryTime");

    window.location.href = "login.html";
  } else {
    window.location.href = "login.html";
  }
});

settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle("show");
});

window.addEventListener("click", () => {
  dropdownMenu.classList.remove("show");
});
</script>
<script src="js/theme.js"></script>
</body>
</html>
