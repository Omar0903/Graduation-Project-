<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>

    <div class="container">

        <div class="left-side">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="Forgot Password Image">
        </div>

        <div class="right-side">
            <div class="lang-switch" style="display:flex; gap:10px;">
                <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="langToggle">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langText">عربي</span>
                </button>
            </div>
            <div class="login-box">
                <h2 data-i18n="forgot_password_title">Forgot Password</h2>
                <p data-i18n="enter_email_reset">Enter your email to receive a reset link</p>

                <form>
                    <div class="input-group">
                        <label data-i18n="reset_email_lbl">Email</label>
                        <input type="email" placeholder="Enter your email" id="email" data-i18n-ph="reset_email_ph" required>
                    </div>

                    <button type="submit" id="reset-btn" data-i18n="send_reset_btn">Send Reset Email</button>

                    <div class="extra-links">
                        <a href="login.html" data-i18n="back_to_login">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="js/localization.js"></script>
    <script type="module" src="js/forgot_password.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
