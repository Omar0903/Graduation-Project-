<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/auth.js"></script>
  <title>Edit Profile</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .edit-container {
      width: 450px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #333;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>
<body>

  <div class="edit-container">
    <h1>Edit Profile</h1>

    <label for="fName">First Name</label>
    <input type="text" id="fName">

    <label for="lName">Last Name</label>
    <input type="text" id="lName">

    <label for="userName">Username</label>
    <input type="text" id="userName">

    <label for="email">Email</label>
    <input type="email" id="email" readonly>

    <label for="phone">Phone</label>
    <input type="text" id="phone">

    <label for="address">Address</label>
    <input type="text" id="address">

    <label for="payment">Payment</label>
    <select id="payment">
      <option value="Cash">Cash</option>
      <option value="Visa">Visa</option>
      <option value="MasterCard">MasterCard</option>
    </select>

    <button id="saveBtn">Save Changes</button>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc,
      getDoc,
      updateDoc,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const fNameInput = document.getElementById("fName");
    const lNameInput = document.getElementById("lName");
    const userNameInput = document.getElementById("userName");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const addressInput = document.getElementById("address");
    const paymentInput = document.getElementById("payment");
    const saveBtn = document.getElementById("saveBtn");

    let currentUid = null;
    let currentUsername = "";

    async function isUsernameTakenByAnotherUser(newUsername) {
      const q = query(collection(db, "users"), where("username", "==", newUsername.trim()));
      const snapshot = await getDocs(q);

      if (snapshot.empty) return false;
      if (snapshot.docs[0].id === currentUid) return false;

      return true;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUid = user.uid;

      try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          alert("User data not found");
          return;
        }

        const data = userSnap.data();
        currentUsername = data.username || "";

        fNameInput.value = data.fname || "";
        lNameInput.value = data.lname || "";
        userNameInput.value = data.username || "";
        emailInput.value = data.email || "";
        phoneInput.value = data.phone || "";
        addressInput.value = data.address || "";
        paymentInput.value = data.payment || "Cash";
      } catch (error) {
        console.error(error);
        alert("Failed to load user data");
      }
    });

    saveBtn.addEventListener("click", async () => {
      const newFname = fNameInput.value.trim();
      const newLname = lNameInput.value.trim();
      const newUsername = userNameInput.value.trim();
      const newEmail = emailInput.value.trim();
      const newPhone = phoneInput.value.trim();
      const newAddress = addressInput.value.trim();
      const newPayment = paymentInput.value;

      if (
        newFname === "" ||
        newLname === "" ||
        newUsername === "" ||
        newEmail === "" ||
        newPhone === "" ||
        newAddress === ""
      ) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        if (newUsername !== currentUsername) {
          const taken = await isUsernameTakenByAnotherUser(newUsername);
          if (taken) {
            alert("Username already exists");
            return;
          }
        }

        await updateDoc(doc(db, "users", currentUid), {
          fname: newFname,
          lname: newLname,
          username: newUsername,
          phone: newPhone,
          address: newAddress,
          payment: newPayment
        });

        if (localStorage.getItem("isLoggedIn") === "true") {
          localStorage.setItem("currentUser", newUsername);
        }

        if (sessionStorage.getItem("isLoggedIn") === "true") {
          sessionStorage.setItem("currentUser", newUsername);
        }

        alert("Profile updated successfully");
        window.location.href = "profile.html";
      } catch (error) {
        console.error(error);
        alert("Failed to update profile");
      }
    });
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
